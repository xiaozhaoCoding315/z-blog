# 发布镜像的构建覆盖文件；运行期仍使用 docker-compose.yml 的服务/卷定义。
name: blog

services:
  app:
    image: ${BLOG_IMAGE:?请在发布脚本中设置不可变 BLOG_IMAGE}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?上线必须设置最终 https:// 域名}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
