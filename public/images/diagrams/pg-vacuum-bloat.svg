<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t d">
<title id="t">PostgreSQL 的 UPDATE 留下历史版本</title>
<desc id="d">UPDATE 是插入新版本 + 标记旧版本死亡。VACUUM 只把死元组的空间标记为可复用，表文件本身不变大也不缩小。</desc>

<g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#646764">
  <text x="48" y="30">UPDATE 之后，旧版本仍然物理存在</text>
</g>

<!-- 表文件 -->
<rect x="48" y="46" width="620" height="120" fill="none" stroke="#d6d7d2" stroke-width="1.2"/>

<g font-family="ui-monospace, monospace" font-size="11">
  <rect x="60" y="60" width="86" height="34" fill="#dae0dc" stroke="#215148" stroke-width="1"/>
  <text x="72" y="82" fill="#131413">v3 可见</text>

  <rect x="154" y="60" width="86" height="34" fill="none" stroke="#646764" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="166" y="82" fill="#646764">v2 死</text>

  <rect x="248" y="60" width="86" height="34" fill="none" stroke="#646764" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="260" y="82" fill="#646764">v1 死</text>

  <rect x="342" y="60" width="86" height="34" fill="#dae0dc" stroke="#215148" stroke-width="1"/>
  <text x="354" y="82" fill="#131413">可见</text>

  <rect x="436" y="60" width="86" height="34" fill="none" stroke="#646764" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="448" y="82" fill="#646764">死元组</text>

  <rect x="530" y="60" width="86" height="34" fill="#dae0dc" stroke="#215148" stroke-width="1"/>
  <text x="542" y="82" fill="#131413">可见</text>

  <!-- 空位 -->
  <rect x="60" y="106" width="86" height="34" fill="none" stroke="#d6d7d2" stroke-width="1"/>
  <rect x="154" y="106" width="86" height="34" fill="none" stroke="#d6d7d2" stroke-width="1"/>
  <rect x="248" y="106" width="86" height="34" fill="none" stroke="#d6d7d2" stroke-width="1"/>
  <rect x="342" y="106" width="86" height="34" fill="none" stroke="#d6d7d2" stroke-width="1"/>
  <rect x="436" y="106" width="86" height="34" fill="none" stroke="#d6d7d2" stroke-width="1"/>
  <rect x="530" y="106" width="86" height="34" fill="none" stroke="#d6d7d2" stroke-width="1"/>
</g>

<!-- VACUUM -->
<g>
  <rect x="48" y="196" width="620" height="76" fill="none" stroke="#d6d7d2" stroke-width="1.2"/>
  <g font-family="ui-monospace, monospace" font-size="11">
    <rect x="60" y="214" width="86" height="34" fill="#dae0dc" stroke="#215148" stroke-width="1"/>
    <text x="72" y="236" fill="#131413">可见</text>

    <rect x="154" y="214" width="86" height="34" fill="#e3e4e0" stroke="#d6d7d2" stroke-width="1"/>
    <text x="166" y="236" fill="#646764">可复用</text>

    <rect x="248" y="214" width="86" height="34" fill="#e3e4e0" stroke="#d6d7d2" stroke-width="1"/>
    <text x="260" y="236" fill="#646764">可复用</text>

    <rect x="342" y="214" width="86" height="34" fill="#dae0dc" stroke="#215148" stroke-width="1"/>
    <text x="354" y="236" fill="#131413">可见</text>

    <rect x="436" y="214" width="86" height="34" fill="#e3e4e0" stroke="#d6d7d2" stroke-width="1"/>
    <text x="448" y="236" fill="#646764">可复用</text>

    <rect x="530" y="214" width="86" height="34" fill="#dae0dc" stroke="#215148" stroke-width="1"/>
    <text x="542" y="236" fill="#131413">可见</text>
  </g>
</g>

<g stroke="#215148" stroke-width="1.4" fill="none" stroke-linecap="round">
  <path d="M358 168 V196"/>
  <path d="M350 188 L358 196 L366 188"/>
</g>
<text x="372" y="186" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#215148">VACUUM</text>

<g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#646764">
  <text x="48" y="302">空间标记为「可复用」而不是「归还操作系统」：</text>
  <text x="48" y="324">表文件大小不变，后续写入填进这些空位。</text>
  <text x="48" y="346">要真正缩小文件，只能 VACUUM FULL 或 pg_repack。</text>
</g>
</svg>
