<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-labelledby="t d">
<title id="t">prompt caching 的前缀匹配</title>
<desc id="d">从第一个 token 开始逐段比对，差异点之前命中缓存。变化最少的内容放最前面，动态内容一律后置。</desc>

<g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#646764">
  <text x="48" y="30">请求 1</text>
  <text x="48" y="118">请求 2</text>
</g>

<!-- 请求 1 -->
<g>
  <rect x="120" y="44" width="150" height="44" fill="#dae0dc" stroke="#215148" stroke-width="1"/>
  <text x="136" y="72" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#131413">系统提示</text>

  <rect x="272" y="44" width="120" height="44" fill="#dae0dc" stroke="#215148" stroke-width="1"/>
  <text x="288" y="72" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#131413">工具定义</text>

  <rect x="394" y="44" width="140" height="44" fill="#dae0dc" stroke="#215148" stroke-width="1"/>
  <text x="410" y="72" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#131413">参考资料</text>

  <rect x="536" y="44" width="136" height="44" fill="none" stroke="#646764" stroke-width="1"/>
  <text x="552" y="72" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#131413">当前问题</text>
</g>

<!-- 请求 2 -->
<g>
  <rect x="120" y="132" width="150" height="44" fill="#dae0dc" stroke="#215148" stroke-width="1"/>
  <text x="136" y="160" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#131413">系统提示</text>

  <rect x="272" y="132" width="120" height="44" fill="#dae0dc" stroke="#215148" stroke-width="1"/>
  <text x="288" y="160" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#131413">工具定义</text>

  <rect x="394" y="132" width="140" height="44" fill="#dae0dc" stroke="#215148" stroke-width="1"/>
  <text x="410" y="160" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#131413">参考资料</text>

  <rect x="536" y="132" width="136" height="44" fill="none" stroke="#646764" stroke-width="1"/>
  <text x="552" y="160" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#131413">新的问题</text>
</g>

<!-- 命中括号 -->
<g stroke="#215148" stroke-width="1.2" fill="none">
  <path d="M120 190 V202 H672 V190"/>
</g>
<text x="120" y="222" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#215148">这一段完全一致 → 命中缓存，按很低的单价计费</text>

<!-- 差异点 -->
<g stroke="#934132" stroke-width="1.4" stroke-dasharray="5 4">
  <path d="M536 30 V196"/>
</g>
<text x="546" y="252" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#934132">差异点之后全价</text>

<g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#646764">
  <text x="48" y="286">前缀里只要混进时间戳、随机 ID 或顺序不固定的数组，</text>
  <text x="48" y="308">整段就永远不命中。</text>
</g>
</svg>
