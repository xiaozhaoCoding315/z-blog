<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d">
<title id="t">固定窗口的边界问题与令牌桶的差异</title>
<desc id="d">固定窗口在跨窗口的两秒内能放行两倍流量；令牌桶按速率补充，允许有限突发但长期速率受控。</desc>

<g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#646764">
  <text x="48" y="28">固定窗口：边界处放过两倍</text>
</g>

<!-- 两个窗口 -->
<g>
  <rect x="48" y="44" width="300" height="120" fill="none" stroke="#d6d7d2" stroke-width="1.2"/>
  <rect x="348" y="44" width="300" height="120" fill="none" stroke="#d6d7d2" stroke-width="1.2"/>
  <text x="160" y="66" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#646764">第 1 分钟（上限 100）</text>
  <text x="460" y="66" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#646764">第 2 分钟（上限 100）</text>

  <!-- 第 1 分钟尾部打满 -->
  <g fill="#215148">
    <rect x="292" y="84" width="6" height="70"/>
    <rect x="302" y="84" width="6" height="70"/>
    <rect x="312" y="84" width="6" height="70"/>
    <rect x="322" y="84" width="6" height="70"/>
    <rect x="332" y="84" width="6" height="70"/>
    <rect x="342" y="84" width="6" height="70"/>
  </g>
  <!-- 第 2 分钟开头打满 -->
  <g fill="#215148">
    <rect x="352" y="84" width="6" height="70"/>
    <rect x="362" y="84" width="6" height="70"/>
    <rect x="372" y="84" width="6" height="70"/>
    <rect x="382" y="84" width="6" height="70"/>
    <rect x="392" y="84" width="6" height="70"/>
    <rect x="402" y="84" width="6" height="70"/>
  </g>
</g>

<!-- 边界高亮 -->
<g stroke="#934132" stroke-width="1.4" stroke-dasharray="5 4">
  <path d="M348 40 V168"/>
</g>
<text x="360" y="184" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#934132">跨过这条线的两秒内实际放行 200 个</text>

<!-- 令牌桶 -->
<g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#646764">
  <text x="48" y="232">令牌桶：长期速率受限，瞬时允许突发</text>
</g>

<g>
  <rect x="48" y="248" width="600" height="96" fill="none" stroke="#d6d7d2" stroke-width="1.2"/>
  <!-- 速率线 -->
  <g stroke="#215148" stroke-width="1.2" stroke-dasharray="4 3">
    <path d="M48 300 H648"/>
  </g>
  <text x="600" y="294" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#215148">rate</text>

  <!-- 桶容量上限 -->
  <g stroke="#646764" stroke-width="1" stroke-dasharray="3 3">
    <path d="M48 262 H648"/>
  </g>
  <text x="586" y="258" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#646764">capacity</text>

  <!-- 突发 -->
  <g fill="#215148">
    <rect x="70" y="264" width="5" height="36"/>
    <rect x="80" y="264" width="5" height="36"/>
    <rect x="90" y="264" width="5" height="36"/>
    <rect x="100" y="264" width="5" height="36"/>
    <rect x="110" y="264" width="5" height="36"/>
    <rect x="120" y="264" width="5" height="36"/>
  </g>
  <text x="70" y="366" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#646764">一波点击，允许连发</text>

  <!-- 匀速部分 -->
  <g fill="#646764">
    <rect x="300" y="292" width="5" height="8"/>
    <rect x="360" y="292" width="5" height="8"/>
    <rect x="420" y="292" width="5" height="8"/>
    <rect x="480" y="292" width="5" height="8"/>
    <rect x="540" y="292" width="5" height="8"/>
  </g>
  <text x="320" y="366" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#646764">之后按速率补充，超出桶容量的请求被拒</text>
</g>
</svg>
