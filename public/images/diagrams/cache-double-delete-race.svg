<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d">
<title id="t">延迟双删要解决的竞态</title>
<desc id="d">线程 A 先删缓存、再更新数据库；在此期间线程 B 读到旧值并写回缓存。第二次删除就是为了清掉 B 写回的脏数据。</desc>

<g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#646764">
  <text x="60" y="30">时刻</text>
  <text x="150" y="30">线程 A（更新）</text>
  <text x="430" y="30">线程 B（读）</text>
</g>

<!-- 泳道分隔 -->
<g stroke="#d6d7d2" stroke-width="1">
  <path d="M120 42 V360"/>
  <path d="M400 42 V360"/>
  <path d="M120 42 H680"/>
</g>

<!-- 时间刻度 -->
<g font-family="ui-monospace, monospace" font-size="11" fill="#646764">
  <text x="72" y="82">t1</text>
  <text x="72" y="142">t2</text>
  <text x="72" y="202">t3</text>
  <text x="72" y="262">t4</text>
  <text x="72" y="322">t5</text>
</g>

<!-- 线程 A 的动作 -->
<g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#131413">
  <rect x="150" y="64" width="210" height="30" fill="none" stroke="#215148" stroke-width="1.2"/>
  <text x="162" y="84">删缓存</text>

  <rect x="150" y="184" width="210" height="30" fill="none" stroke="#215148" stroke-width="1.2"/>
  <text x="162" y="204">更新数据库 → 新值</text>

  <rect x="150" y="304" width="210" height="30" fill="none" stroke="#215148" stroke-width="1.2"/>
  <text x="162" y="324">再删一次缓存</text>
</g>

<!-- 线程 B 的动作 -->
<g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#131413">
  <rect x="430" y="124" width="230" height="30" fill="none" stroke="#646764" stroke-width="1.2"/>
  <text x="442" y="144">缓存未命中，读库 → 旧值</text>

  <rect x="430" y="244" width="230" height="30" fill="none" stroke="#646764" stroke-width="1.2"/>
  <text x="442" y="264">把旧值写回缓存</text>
</g>

<!-- 关键箭头：B 的写回发生在 A 更新之后 -->
<g stroke="#646764" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-dasharray="4 4">
  <path d="M315 214 C380 214 400 250 428 256"/>
</g>

<!-- 结论标注 -->
<g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#646764">
  <text x="430" y="292">此时缓存是旧值、数据库是新值</text>
  <text x="150" y="356">t5 的第二次删除把它清掉</text>
</g>
</svg>
