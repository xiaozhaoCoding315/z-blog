<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d">
<title id="t">三种编排形态</title>
<desc id="d">单 Agent 一条对话链；工作流由代码决定步骤；多 Agent 只在子任务互相独立时才有意义。</desc>

<!-- 纸底：亮色下与页面同色，暗色下随 filter 一起反相 -->
<rect id="paper" x="0" y="0" width="720" height="400" fill="#ecede9"/>

<g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#5b5e5b">
  <text x="40" y="26">单 Agent</text>
  <text x="268" y="26">工作流</text>
  <text x="500" y="26">多 Agent</text>
</g>

<!-- 单 Agent：一条循环 -->
<g>
  <rect x="40" y="42" width="180" height="34" fill="none" stroke="#215148" stroke-width="1.2"/>
  <text x="56" y="64" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#131413">模型</text>

  <rect x="40" y="96" width="180" height="34" fill="none" stroke="#5b5e5b" stroke-width="1.2"/>
  <text x="56" y="118" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#131413">工具调用</text>

  <rect x="40" y="150" width="180" height="34" fill="none" stroke="#5b5e5b" stroke-width="1.2"/>
  <text x="56" y="172" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#131413">工具结果</text>

  <g stroke="#215148" stroke-width="1.2" fill="none" stroke-linecap="round">
    <path d="M130 76 V96"/>
    <path d="M130 130 V150"/>
    <path d="M220 167 C244 167 244 59 220 59"/>
  </g>

  <text x="40" y="214" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#5b5e5b">上下文连续，</text>
  <text x="40" y="232" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#5b5e5b">调试只需读一条</text>
  <text x="40" y="250" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#5b5e5b">消息序列</text>
</g>

<!-- 工作流：写死的步骤 -->
<g>
  <rect x="268" y="42" width="150" height="34" fill="none" stroke="#215148" stroke-width="1.2"/>
  <text x="284" y="64" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#131413">拆解（模型）</text>

  <rect x="268" y="104" width="150" height="34" fill="none" stroke="#5b5e5b" stroke-width="1.2"/>
  <text x="284" y="126" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#131413">步骤 1</text>

  <rect x="268" y="148" width="150" height="34" fill="none" stroke="#5b5e5b" stroke-width="1.2"/>
  <text x="284" y="170" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#131413">步骤 2</text>

  <rect x="268" y="192" width="150" height="34" fill="none" stroke="#5b5e5b" stroke-width="1.2"/>
  <text x="284" y="214" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#131413">步骤 3</text>

  <rect x="268" y="250" width="150" height="34" fill="none" stroke="#215148" stroke-width="1.2"/>
  <text x="284" y="272" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#131413">汇总（模型）</text>

  <g stroke="#5b5e5b" stroke-width="1.2" fill="none" stroke-linecap="round">
    <path d="M343 76 V104"/>
    <path d="M343 138 V148"/>
    <path d="M343 182 V192"/>
    <path d="M343 226 V250"/>
  </g>

  <text x="268" y="306" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#5b5e5b">流程由代码决定，</text>
  <text x="268" y="324" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#5b5e5b">每个节点可单独测试</text>
</g>

<!-- 多 Agent -->
<g>
  <rect x="500" y="42" width="150" height="34" fill="none" stroke="#215148" stroke-width="1.2"/>
  <text x="516" y="64" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#131413">主管</text>

  <rect x="452" y="104" width="80" height="34" fill="none" stroke="#5b5e5b" stroke-width="1.2"/>
  <text x="464" y="126" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#131413">采集 A</text>

  <rect x="540" y="104" width="80" height="34" fill="none" stroke="#5b5e5b" stroke-width="1.2"/>
  <text x="552" y="126" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#131413">采集 B</text>

  <rect x="628" y="104" width="80" height="34" fill="none" stroke="#5b5e5b" stroke-width="1.2"/>
  <text x="640" y="126" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#131413">采集 C</text>

  <g stroke="#5b5e5b" stroke-width="1.2" fill="none" stroke-linecap="round">
    <path d="M560 76 L500 104"/>
    <path d="M575 76 V104"/>
    <path d="M590 76 L660 104"/>
  </g>

  <!-- 子 Agent 之间不通信 -->
  <g stroke="#934132" stroke-width="1.4" stroke-dasharray="4 4">
    <path d="M532 121 H540"/>
    <path d="M620 121 H628"/>
  </g>

  <text x="500" y="166" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#5b5e5b">子任务之间不通信：</text>
  <text x="500" y="184" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#934132">一旦需要互相对话，</text>
  <text x="500" y="202" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#934132">协调成本就爆炸了</text>
</g>

<!-- 底部：适用判断 -->
<g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#5b5e5b">
  <text x="40" y="368">判断顺序：能画出一张确定的流程图 → 用工作流；画不出 → 单 Agent 自己决策；只有子任务互相独立 → 才拆多 Agent。</text>
</g>
</svg>
