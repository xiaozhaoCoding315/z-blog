<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d">
<title id="t">HTTP/2 与 HTTP/3 的协议栈对比</title>
<desc id="d">左边 HTTP/2 的传输可靠性落在 TCP 上，丢包会阻塞整条连接；右边 HTTP/3 把可靠性与多路复用搬进 QUIC，跑在 UDP 之上，每个流独立。</desc>

<g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#646764">
  <text x="72" y="36">HTTP/2</text>
  <text x="420" y="36">HTTP/3</text>
</g>

<!-- 左：HTTP/2 栈 -->
<g>
  <rect x="72" y="52" width="250" height="46" fill="none" stroke="#d6d7d2" stroke-width="1.2"/>
  <text x="88" y="80" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#131413">HTTP/2</text>
  <text x="180" y="80" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#646764">应用层多路复用</text>

  <rect x="72" y="104" width="250" height="46" fill="none" stroke="#d6d7d2" stroke-width="1.2"/>
  <text x="88" y="132" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#131413">TLS</text>

  <rect x="72" y="156" width="250" height="46" fill="#e3e4e0" stroke="#646764" stroke-width="1.2"/>
  <text x="88" y="184" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#131413">TCP</text>
  <text x="140" y="184" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#646764">可靠性 + 排队都在这里</text>

  <rect x="72" y="208" width="250" height="34" fill="none" stroke="#d6d7d2" stroke-width="1.2"/>
  <text x="88" y="230" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#131413">IP</text>

  <!-- 丢包标记：放在 TCP 框内右侧，避免压到旁边的栈 -->
  <g stroke="#934132" stroke-width="1.5">
    <path d="M300 170 L316 186 M316 170 L300 186" stroke-linecap="round"/>
  </g>
  <text x="72" y="258" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#934132">一个包丢失，整条连接一起等</text>
</g>

<!-- 右：HTTP/3 栈 -->
<g>
  <rect x="420" y="52" width="250" height="46" fill="none" stroke="#d6d7d2" stroke-width="1.2"/>
  <text x="436" y="80" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#131413">HTTP/3</text>
  <text x="512" y="80" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#646764">流的概念</text>

  <rect x="420" y="104" width="250" height="86" fill="none" stroke="#215148" stroke-width="1.4"/>
  <text x="436" y="132" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#131413">QUIC</text>
  <text x="436" y="154" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#646764">可靠性 + 多路复用 + TLS 1.3</text>
  <text x="436" y="174" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#646764">每个流独立重传</text>

  <rect x="420" y="196" width="250" height="34" fill="none" stroke="#d6d7d2" stroke-width="1.2"/>
  <text x="436" y="218" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#131413">UDP</text>
  <text x="482" y="218" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#646764">只负责发出去</text>

  <rect x="420" y="236" width="250" height="34" fill="none" stroke="#d6d7d2" stroke-width="1.2"/>
  <text x="436" y="258" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#131413">IP</text>

  <text x="420" y="292" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#646764">丢的那个包只阻塞它自己的流</text>
</g>

<!-- 结论 -->
<g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#646764">
  <text x="72" y="312">队头阻塞从「整条连接」缩小到「单个流」</text>
  <text x="72" y="334">代价：加密在用户态做，CPU 开销更高；</text>
  <text x="72" y="354">UDP 在部分网络里会被限速或直接丢弃。</text>
</g>
</svg>
